name: Bug report
description: Something is broken or behaving unexpectedly.
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill out the fields below so we can reproduce the issue quickly.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the bug.
      placeholder: "Coding prompts are being routed to OpenAI even when ANTHROPIC_API_KEY is set."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the exact request body and any relevant configuration.
      placeholder: |
        1. Set ANTHROPIC_API_KEY=...
        2. Start the gateway: `dotnet run --project src/AiGateway.Api/AiGateway.Api.csproj`
        3. POST /api/v1/chat/completions with `{"prompt":"Refactor this function..."}`
        4. Response shows `"providerUsed":"OpenAi"` instead of `"Anthropic"`.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the response body or the full error / stack trace.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AI Gateway version or commit SHA
      placeholder: "0.1.0 or 2136266"
    validations:
      required: true
  - type: input
    id: dotnet
    attributes:
      label: .NET SDK version
      description: Output of `dotnet --version`.
      placeholder: "10.0.100"
    validations:
      required: true
  - type: dropdown
    id: providers
    attributes:
      label: Providers configured
      multiple: true
      options:
        - OpenAI
        - Anthropic
        - Google
        - Ollama (planned)
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / architecture
      placeholder: "Windows 11 x64, macOS 14 arm64, Ubuntu 24.04 x64"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant log output. Redact any API keys.
      render: text
  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions and did not find a duplicate.
          required: true
        - label: I have redacted any secrets from logs and request bodies.
          required: true
